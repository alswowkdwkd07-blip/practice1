<script>
  function selectRating(ratingName, btnElement) {
    // 1. 알림 띄우기
    alert(ratingName + '을(를) 선택했어요!');

    // 2. 모든 평점 버튼 가져오기
    const buttons = document.querySelectorAll('.rate-btn');

    // 3. 모든 버튼 비활성화 (못 누르게 함) 및 시각적 효과 변경
    buttons.forEach(btn => {
      btn.disabled = true;
    });

    // 4. 내가 누른 버튼만 특별히 강조 표시 (선택했다고 표시)
    btnElement.style.background = '#2f9e5b';
    btnElement.innerText = '선택됨 (' + ratingName + ')';
  }
</script>
